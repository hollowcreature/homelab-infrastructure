theme: dark

server:
  address: 'tcp://0.0.0.0:9091/authelia'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'
        authn_strategies:
          - name: 'HeaderAuthorization'
            schemes:
              - 'Bearer'
          - name: 'CookieSession'
      forward-auth-jellyfin:
        implementation: 'ForwardAuth'
        authn_strategies:
          - name: 'CookieSession'
    # Feel free to change this as you like, as this was tweaked for debug purposes
    rate_limits:
      openid_connect_token:
        enable: true
        buckets:
          - period: '1 minute'
            requests: 200
          - period: '10 minutes'
            requests: 1000

log:
  level: debug

totp:
  issuer: your-issuer

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain: your-domain.example.com
      resources:
        - '^/.*$'
      subject: 'oauth2:client:healthchecker'
      policy: one_factor

    - domain: your-domain.example.com
      policy: one_factor

session:
  name: authelia_session
  secret: YOUR-SECRET
  cookies:
    - domain: your-domain.example.com
      authelia_url: 'https://your-domain.example.com/authelia'

storage:
  encryption_key: YOUR-ENCRYPTION-KEY
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt

identity_validation:
  reset_password:
    jwt_secret: YOUR-JWT-SECRET

identity_providers:
  oidc:
    # Generate with: docker run --rm authelia/authelia:latest authelia crypto rand --length 64 --charset alphanumeric
    hmac_secret: YOUR-HMAC-SECRET
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        # Generate with: docker run --rm -v ./config:/config authelia/authelia:latest authelia crypto pair rsa generate --directory /config --file.private-key oidc_private_key.pem --file.public-key oidc_public_key.pem --legacy
        # Paste the contents of the generated .pem file here
        key: |
          YOUR-PRIVATE-KEY
    clients:
      - client_id: healthchecker
        client_name: Dashboard Health Checker
        client_secret: YOUR-CLIENT-SECRET-HASH
        public: false
        authorization_policy: one_factor
        audience:
          - 'https://your-domain.example.com/grafana/'
          - 'https://your-domain.example.com/vault/'
          - 'https://your-domain.example.com/jellyfin-health/'
          - 'https://your-domain.example.com/gitea/'
          - 'https://your-domain.example.com/nextcloud/'
          - 'https://your-domain.example.com:8444/'
          - 'https://your-domain.example.com:8445/admin/'
        grant_types:
          - client_credentials
        scopes:
          - authelia.bearer.authz
        token_endpoint_auth_method: client_secret_basic

      - client_id: grafana
        client_name: Grafana
        client_secret: YOUR-CLIENT-SECRET-HASH
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - https://your-domain.example.com/grafana/login/generic_oauth
        scopes:
          - openid
          - profile
          - email
          - groups

      - client_id: gitea
        client_name: Gitea
        client_secret: YOUR-CLIENT-SECRET-HASH
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - https://your-domain.example.com/gitea/user/oauth2/authelia/callback
        scopes:
          - openid
          - profile
          - email
          - groups

      - client_id: jellyfin
        client_name: Jellyfin
        client_secret: YOUR-CLIENT-SECRET-HASH
        public: false
        authorization_policy: one_factor
        require_pushed_authorization_requests: false
        token_endpoint_auth_method: client_secret_post
        redirect_uris:
          - http://your-domain.example.com/jellyfin/sso/OID/redirect/authelia
          - https://your-domain.example.com/jellyfin/sso/OID/redirect/authelia
        scopes:
          - openid
          - profile
          - email
          - groups

      - client_id: nextcloud
        client_name: Nextcloud
        client_secret: YOUR-CLIENT-SECRET-HASH
        public: false
        authorization_policy: one_factor
        token_endpoint_auth_method: client_secret_post
        redirect_uris:
          - https://your-domain.example.com/nextcloud/apps/user_oidc/code
        scopes:
          - openid
          - profile
          - email
          - groups

      - client_id: vaultwarden
        client_name: Vaultwarden
        client_secret: YOUR-CLIENT-SECRET-HASH
        public: false
        authorization_policy: one_factor
        token_endpoint_auth_method: client_secret_basic
        redirect_uris:
          - https://your-domain.example.com/vault/identity/connect/oidc-signin
        scopes:
          - openid
          - profile
          - email
          - offline_access
